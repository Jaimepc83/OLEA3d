<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SAMURAI SHODOWN - OLEA3D Arcade Zone</title>
    <style>
        /* Bloqueo rígido absoluto para evitar gestos de zoom y descuadres de pantalla */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            touch-action: none; 
            position: fixed; 
        }
        
        #game-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1;
        }
        
        #game { 
            width: 100%; 
            height: 100%; 
        }
        
        /* --- PANEL DE CONTROL FLOTANTE OLEA3D --- */
        #olea-hud {
            position: fixed; 
            top: -70px; 
            left: 0; 
            width: 100vw; 
            height: auto;
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            box-sizing: border-box; 
            padding: 20px; 
            z-index: 2147483647; 
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding-top: max(20px, env(safe-area-inset-top)); 
            pointer-events: none; 
        }
        
        #olea-hud.visible { 
            top: 0; 
        }
        
        .hud-grupo { 
            display: flex; 
            gap: 10px; 
            pointer-events: auto; 
        }

        .btn-olea {
            padding: 10px 18px; 
            border-radius: 25px;
            font-family: Arial, sans-serif; 
            font-size: 11px; 
            font-weight: bold;
            text-transform: uppercase; 
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.25); 
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px); 
            background: rgba(15, 15, 15, 0.6);
            transition: transform 0.1s, background-color 0.2s;
        }
        
        .btn-exit { 
            background: rgba(180, 0, 30, 0.85); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
        }
        
        .btn-full { background: rgba(0, 130, 230, 0.85); } 
        .btn-save { background: rgba(0, 91, 159, 0.85); } /* Azul SNES */
        .btn-load { background: rgba(200, 150, 20, 0.85); }
        
        .btn-olea:active { 
            transform: scale(0.92); 
        }

        /* --- VENTANA DE NOTIFICACIÓN TOAST --- */
        #save-toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(10, 10, 10, 0.9); 
            border: 1px solid #9dff3d; 
            color: #9dff3d; 
            padding: 10px 22px; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 11px; 
            opacity: 0; 
            pointer-events: none; 
            transition: transform 0.3s, opacity 0.3s; 
            z-index: 2147483647; 
            text-align: center; 
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        #save-toast.show { 
            opacity: 1; 
            transform: translateX(-50%) translateY(-10px); 
        }
    </style>
</head>
<body>
    <div id="game-container"><div id="game"></div></div>
    
    <div id="olea-hud">
        <div class="hud-grupo">
            <a href="index.html" class="btn-olea btn-exit">⬅ SALIR</a>
            <button class="btn-olea btn-full" onclick="pantallaCompleta()">📺 FULL</button>
        </div>
        <div class="hud-grupo">
            <button class="btn-olea btn-save" onclick="oleaSave()">💾 GUARDAR</button>
            <button class="btn-olea btn-load" onclick="oleaLoad()">📂 CARGAR</button>
        </div>
    </div>

    <div id="save-toast">✅ Operación realizada con éxito</div>

    <script>
        const hud = document.getElementById('olea-hud'); 
        let temporizadorHUD;
        
        function mostrarHUD() { 
            hud.classList.add('visible'); 
            clearTimeout(temporizadorHUD); 
            temporizadorHUD = setTimeout(() => { 
                hud.classList.remove('visible'); 
            }, 3500); 
        }
        
        window.addEventListener('touchstart', mostrarHUD, {passive: true});
        window.addEventListener('mousemove', mostrarHUD);

        // Controlador de Pantalla Completa Nativa
        document.addEventListener('fullscreenchange', () => {
            const toast = document.getElementById('save-toast');
            if (document.fullscreenElement) {
                try { 
                    document.fullscreenElement.appendChild(hud); 
                    document.fullscreenElement.appendChild(toast); 
                } catch(e) { console.error(e); }
            } else {
                document.body.appendChild(hud);
                document.body.appendChild(toast);
            }
        });

        function oleaSave() {
            try {
                if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                    window.EJS_emulator.gameManager.quickSave(1); 
                    mostrarToast('💾 Partida guardada en el navegador');
                } else { 
                    mostrarToast('❌ Espera a que el cartucho cargue...'); 
                }
            } catch(e) { console.error(e); }
        }

        function oleaLoad() {
            try {
                if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                    window.EJS_emulator.gameManager.quickLoad(1); 
                    mostrarToast('📂 Partida cargada correctamente');
                } else { 
                    mostrarToast('❌ Espera a que el cartucho cargue...'); 
                }
            } catch(e) { console.error(e); }
        }

        function pantallaCompleta() {
            let elemento = document.documentElement;
            if (!document.fullscreenElement) {
                if (elemento.requestFullscreen) {
                    elemento.requestFullscreen();
                } else if (elemento.webkitRequestFullscreen) {
                    elemento.webkitRequestFullscreen();
                } else if (elemento.msRequestFullscreen) {
                    elemento.msRequestFullscreen();
                }
                mostrarToast('📺 Pantalla completa activada');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                mostrarToast('📱 Modo de vista normal');
            }
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('save-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        /* --- ENTORNO DE EJECUCIÓN EMULATORJS --- */
        window.EJS_player = '#game'; 
        window.EJS_core = 'snes'; 
        window.EJS_gameName = 'Samurai Shodown'; 
        window.EJS_gameUrl = 'samurai.sfc'; 
        window.EJS_color = '#005b9f'; 
        window.EJS_startOnLoaded = true; 
        
        // Redirigimos al servidor espejo rápido para evitar latencias de carga
        window.EJS_pathtodata = 'https://unpkg.com/@emulatorjs/emulatorjs@latest/data/';
    </script>
    <script src="https://unpkg.com/@emulatorjs/emulatorjs@latest/data/loader.js"></script>
</body>
</html>
