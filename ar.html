<!DOCTYPE html>
<html>
<head>
    <title>VALIDACIÓN CÁMARA + ASSET - ÚBEDA</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
      AFRAME.registerComponent('confirm-load', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            console.log("¡Growlithe Cargado! ✅");
            alert("¡Growlithe Cargado! Si no lo ves, apunta al marcador.");
          });
          this.el.addEventListener('model-error', (e) => {
            console.error("Error cargando modelo:", e.detail.src);
            alert("Error cargando el modelo. Verifica el archivo.");
          });
        }
      });
    </script>
</head>
<body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs>
        
        <a-assets>
            <a-asset-item id="growlithe-model" src="Growlithe.glb"></a-asset-item>
        </a-assets>

        <a-marker preset='hiro'>
            <a-entity gltf-model="#growlithe-model" scale="0.01 0.01 0.01" confirm-load></a-entity>

        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
    
</body>
</html>
