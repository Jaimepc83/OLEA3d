<body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs='sourceType: camera;'>
        
        <a-assets>
            <a-asset-item id="growlithe-model" src="Growlithe.glb"></a-asset-item>
        </a-assets>

        <a-marker preset='hiro'>
            
            <a-entity gltf-model="#growlithe-model" scale="0.1 0.1 0.1" animation-mixer></a-entity>
        
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
    
</body>
